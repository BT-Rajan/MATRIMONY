<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>நிர்வாகம் - கார்காத்தார் மங்கள சந்திப்பு</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  main { max-width: 980px; }
  #logoutBtn { float: right; margin-top: 0; }
  .stat { display: inline-block; margin-right: 22px; }
  .stat b { font-size: 1.3rem; display: block; }
</style>
</head>
<body>
<header class="site">
  <h1>நிர்வாக பலகை</h1>
  <p>கார்காத்தார் மங்கள சந்திப்பு</p>
</header>
<main>
  <div id="banner"></div>

  <form id="loginForm" class="card">
    <h2>நிர்வாக உள்நுழைவு</h2>
    <label>பயனர்பெயர்</label>
    <input name="username" required>
    <label>கடவுச்சொல்</label>
    <input type="password" name="password" required>
    <button type="submit">உள்நுழைய</button>
  </form>

  <div id="dashboard" style="display:none">
    <button id="logoutBtn" class="secondary">வெளியேறு</button>

    <div class="card" id="reportsCard">
      <h2>அறிக்கை (பாலினம் வாரியாக)</h2>
      <div id="summaryStats"></div>
      <p>
        <a class="btn" id="csvBride" href="#">மணமகள் CSV பதிவிறக்கம்</a>
        <a class="btn" id="csvGroom" href="#">மணமகன் CSV பதிவிறக்கம்</a>
        <a class="btn" id="csvAll" href="#">அனைத்தும் CSV பதிவிறக்கம்</a>
      </p>
    </div>

    <div class="card">
      <h2>சுயவிவரங்கள்</h2>
      <div class="toolbar">
        <input id="searchQ" placeholder="பெயர் / பதிவு எண் / மின்னஞ்சல் / மொபைல்">
        <select id="filterGender">
          <option value="">அனைத்து பாலினம்</option>
          <option value="groom">மணமகன்</option>
          <option value="bride">மணமகள்</option>
        </select>
        <select id="filterStatus">
          <option value="">அனைத்து நிலை</option>
          <option value="pending">பரிசீலனையில்</option>
          <option value="approved">ஏற்றுக்கொள்ளப்பட்டது</option>
          <option value="rejected">நிராகரிக்கப்பட்டது</option>
        </select>
        <button id="searchBtn" style="margin-top:0">தேடு</button>
      </div>
      <table id="resultsTable">
        <thead>
          <tr><th>பதிவு எண்</th><th>பெயர்</th><th>பாலினம்</th><th>மொபைல்</th><th>நிலை</th><th></th></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <p class="muted" id="pagerInfo"></p>
      <button id="prevPage" class="secondary" style="margin-top:0">முந்தைய</button>
      <button id="nextPage" class="secondary" style="margin-top:0">அடுத்தது</button>
    </div>
  </div>

  <form id="editForm" class="card" style="display:none" enctype="multipart/form-data">
    <h2>சுயவிவரத்தை திருத்த <span id="editRegNo" class="muted"></span></h2>
    <input type="hidden" name="id">
    <div class="row">
      <div><label>பெயர்</label><input name="name"></div>
      <div><label>பாலினம்</label>
        <select name="gender"><option value="groom">மணமகன்</option><option value="bride">மணமகள்</option></select>
      </div>
    </div>
    <div class="row">
      <div><label>பிறந்த தேதி</label><input type="date" name="dob"></div>
      <div><label>மின்னஞ்சல்</label><input type="email" name="email"></div>
    </div>
    <div class="row">
      <div><label>மொபைல் எண்</label><input name="phone1"></div>
      <div><label>வாட்ஸ்அப் / மற்றொரு எண்</label><input name="phone2"></div>
    </div>
    <label>கோத்திரம்</label><input name="gothram">
    <label>முகவரி</label><textarea name="address" rows="2"></textarea>
    <label>வட்டாரம்</label><input name="quarter">
    <div class="row">
      <div><label>உயரம் (செ.மீ.)</label><input type="number" name="height_cm"></div>
      <div><label>கல்வி</label><select name="education" id="editEducation"></select></div>
    </div>
    <label>தொழில்</label><select name="occupation" id="editOccupation"></select>
    <div class="row">
      <div><label>தந்தை பெயர்</label><input name="father_name"></div>
      <div><label>தாய் பெயர்</label><input name="mother_name"></div>
    </div>
    <div class="row">
      <div><label>நட்சத்திரம்</label><select name="star" id="editStar"></select></div>
      <div><label>ராசி</label><select name="rasi" id="editRasi"></select></div>
    </div>
    <div class="row">
      <div><label>சொந்த ஊர்</label><input name="native_place"></div>
      <div><label>தற்போதைய இருப்பிடம்</label><input name="residence"></div>
    </div>
    <label>பதிவாளர் பெயர்</label><input name="registrar_name">
    <div class="row">
      <div><label>சகோதரர்கள்</label><input type="number" name="brothers"></div>
      <div><label>சகோதரிகள்</label><input type="number" name="sisters"></div>
    </div>
    <label>நிகழ்வில் கலந்துகொள்வது</label>
    <select name="participating"><option value="yes">ஆம்</option><option value="no">இல்லை</option></select>
    <div class="row">
      <div><label>கட்டண தொகை</label><input type="number" step="0.01" name="payment_amount"></div>
      <div><label>கட்டண தேதி</label><input type="date" name="payment_date"></div>
    </div>
    <label>குறிப்பு எண்</label><input name="payment_reference">
    <label>நிலை</label>
    <select name="status">
      <option value="pending">பரிசீலனையில்</option>
      <option value="approved">ஏற்றுக்கொள்ளப்பட்டது</option>
      <option value="rejected">நிராகரிக்கப்பட்டது</option>
    </select>
    <label>புதிய கட்டண சான்று (மாற்ற விரும்பினால் மட்டும்)</label>
    <input type="file" name="payment_proof" accept=".jpg,.jpeg,.png,.pdf">
    <div>
      <button type="submit">சேமிக்கவும்</button>
      <button type="button" class="secondary" id="approveBtn">ஏற்றுக்கொள்</button>
      <button type="button" class="secondary" id="rejectBtn">நிராகரி</button>
      <button type="button" class="secondary" id="closeEditBtn">மூடு</button>
    </div>
  </form>
</main>
<script src="../assets/data.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
