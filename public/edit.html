<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>சுயவிவரத்தை திருத்த - கார்காத்தார் மங்கள சந்திப்பு</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <h1>கார்காத்தார் மங்கள சந்திப்பு</h1>
  <p>சுயவிவரத்தை திருத்த</p>
</header>
<main>
  <p class="center"><a href="index.html">← புதிய பதிவு</a></p>
  <div id="banner"></div>

  <!-- Step 1: request OTP -->
  <form id="otpRequestForm" class="card">
    <h2>உங்கள் மின்னஞ்சலை உள்ளிடவும்</h2>
    <label>மின்னஞ்சல்</label>
    <input type="email" name="email" required>
    <button type="submit">OTP அனுப்பவும்</button>
  </form>

  <!-- Step 2: verify OTP -->
  <form id="otpVerifyForm" class="card" style="display:none">
    <h2>OTP ஐ உள்ளிடவும்</h2>
    <p class="muted">உங்கள் மின்னஞ்சலுக்கு அனுப்பப்பட்ட 6 இலக்க OTP ஐ உள்ளிடவும் (10 நிமிடங்களுக்கு செல்லுபடியாகும்).</p>
    <label>OTP</label>
    <input name="otp" maxlength="6" inputmode="numeric" required>
    <button type="submit">சரிபார்க்கவும்</button>
    <button type="button" class="secondary" id="backBtn">← பின்</button>
  </form>

  <!-- Step 3: edit form -->
  <form id="editForm" class="card" style="display:none" enctype="multipart/form-data">
    <h2>உங்கள் சுயவிவரம் <span id="regNoLabel" class="muted"></span></h2>

    <div class="row">
      <div><label>மொபைல் எண்</label><input name="phone1" maxlength="10"></div>
      <div><label>வாட்ஸ்அப் / மற்றொரு எண்</label><input name="phone2" maxlength="10"></div>
    </div>
    <label>கோத்திரம்</label>
    <input name="gothram">
    <label>முகவரி</label>
    <textarea name="address" rows="2"></textarea>
    <label>வட்டாரம் / குடும்பம்</label>
    <input name="quarter">
    <div class="row">
      <div><label>உயரம் (செ.மீ.)</label><input type="number" name="height_cm" min="100" max="250"></div>
      <div><label>கல்வி</label><select name="education" id="education"></select></div>
    </div>
    <label>தொழில்</label>
    <select name="occupation" id="occupation"></select>
    <div class="row">
      <div><label>தந்தை பெயர்</label><input name="father_name"></div>
      <div><label>தாய் பெயர்</label><input name="mother_name"></div>
    </div>
    <div class="row">
      <div><label>நட்சத்திரம்</label><select name="star" id="star"></select></div>
      <div><label>ராசி</label><select name="rasi" id="rasi"></select></div>
    </div>
    <div class="row">
      <div><label>சொந்த ஊர்</label><input name="native_place"></div>
      <div><label>தற்போதைய இருப்பிடம்</label><input name="residence"></div>
    </div>
    <label>பதிவாளர் பெயர்</label>
    <input name="registrar_name">
    <div class="row">
      <div><label>சகோதரர்கள்</label><input type="number" name="brothers" min="0" max="20"></div>
      <div><label>சகோதரிகள்</label><input type="number" name="sisters" min="0" max="20"></div>
    </div>
    <label>நிகழ்வில் நேரில் கலந்துகொள்வீர்களா?</label>
    <select name="participating">
      <option value="yes">ஆம்</option>
      <option value="no">இல்லை</option>
    </select>

    <h2 style="margin-top:24px">கட்டணம்</h2>
    <div class="row">
      <div><label>கட்டண தொகை (₹)</label><input type="number" step="0.01" name="payment_amount"></div>
      <div><label>கட்டண தேதி</label><input type="date" name="payment_date"></div>
    </div>
    <label>பரிவர்த்தனை / குறிப்பு எண்</label>
    <input name="payment_reference">
    <label>புதிய கட்டண சான்று (மாற்ற விரும்பினால் மட்டும்)</label>
    <input type="file" name="payment_proof" accept=".jpg,.jpeg,.png,.pdf">

    <button type="submit" id="saveBtn">சேமிக்கவும்</button>
  </form>
</main>
<script src="assets/data.js"></script>
<script src="assets/edit.js"></script>
</body>
</html>
